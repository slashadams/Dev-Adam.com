---
layout: default
---
<article style="max-width:720px;margin:0 auto;padding:4rem 1.5rem">
  <header style="margin-bottom:3rem">
    <p style="color:var(--text-muted);font-size:0.875rem;margin-bottom:0.5rem">
      {{ page.date | date: "%B %d, %Y" }} · {{ content | number_of_words | divided_by: 200 | plus: 1 }} min read
    </p>
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.subtitle %}
    <p class="post-subtitle">{{ page.subtitle }}</p>
    {% endif %}
  </header>

  <!-- Article Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Article",
    "headline": "{{ page.title | escape }}",
    "description": "{{ page.excerpt | strip_html | truncatewords: 30 | escape }}",
    "author": {
      "@type": "Person",
      "name": "Adam"
    },
    "datePublished": "{{ page.date | date_to_xmlschema }}",
    "mainEntityOfPage": {
      "@type": "WebPage",
      "@id": "{{ page.url | absolute_url }}"
    }
  }
  </script>

  <div class="blog-content" style="font-size:1.05rem;line-height:1.6;color:var(--text-secondary)">
    {{ content }}
  </div>

  <hr style="border:none;border-top:1px solid var(--border);margin:3rem 0">

  <div style="text-align:center">
    <a href="/blog/" style="color:var(--accent-light)">&larr; Back to all posts</a>
  </div>
</article>

<style>
.post-title { font-size: 2.5rem; line-height: 1.15; margin: 0 0 1rem 0; color: var(--text-primary); }
.post-subtitle { font-size: 1.15rem; color: var(--text-secondary); margin: 0; }
@media (max-width: 768px) {
  .post-title { font-size: 1.75rem; line-height: 1.2; }
  .post-subtitle { font-size: 1rem; }
}
.blog-content h2 { font-size:1.6rem; color:var(--text-primary); margin:2rem 0 1rem; }
.blog-content h3 { font-size:1.25rem; color:var(--text-primary); margin:1.75rem 0 0.75rem; }
.blog-content p { margin:0 0 1.25rem; }
.blog-content a { color:var(--accent-light); text-decoration:underline; }
.blog-content a:hover { color:var(--accent); }
.blog-content code { background:var(--bg-elevated); padding:0.2rem 0.4rem; border-radius:4px; font-size:0.9em; }
.blog-content pre { background:var(--bg-card); border:1px solid var(--border); border-radius:8px; padding:1.25rem; overflow-x:auto; margin:1.5rem 0; }
.blog-content pre code { background:none; padding:0; }
.blog-content blockquote { border-left:3px solid var(--accent); padding-left:1rem; margin:1.5rem 0; color:var(--text-muted); font-style:italic; }
.blog-content ul, .blog-content ol { margin:0 0 1.25rem; padding-left:1.5rem; }
.blog-content li { margin-bottom:0.5rem; }
.blog-content img { max-width:100%; border-radius:8px; margin:1.5rem 0; }
.blog-content hr { border:none; border-top:1px solid var(--border); margin:2rem 0; }
</style>

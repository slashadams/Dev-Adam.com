<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{% if page.description %}{{ page.description | escape }}{% else %}{{ site.description | escape }}{% endif %}">
  <meta name="author" content="Adam">
  <meta name="keywords" content="{% if page.tags %}{{ page.tags | join: ', ' | escape }}{% else %}AI agents, D&D AI Dungeon Master, developer tools, OpenClaw, AI products{% endif %}">
  <title>{% if page.title %}{{ page.title | escape }}{% else %}Adam · dev-adam.com{% endif %}</title>
  
  <!-- Open Graph -->
  <meta property="og:title" content="{% if page.title %}{{ page.title | escape }}{% else %}Adam · dev-adam.com{% endif %}">
  <meta property="og:description" content="{% if page.description %}{{ page.description | escape }}{% else %}{{ site.description | escape }}{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:site_name" content="dev-adam.com">
  {% if page.date %}<meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">{% endif %}
  
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% if page.title %}{{ page.title | escape }}{% else %}Adam · dev-adam.com{% endif %}">
  <meta name="twitter:description" content="{% if page.description %}{{ page.description | escape }}{% else %}{{ site.description | escape }}{% endif %}">
  
  <!-- Canonical URL -->
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  
  <!-- Structured Data (homepage only) -->
  {% if page.url == '/' %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Adam",
    "url": "https://www.dev-adam.com",
    "sameAs": ["https://github.com/slashadams"],
    "description": "Building AI agents for specific jobs — property management, D&D, and beyond."
  }
  </script>
  {% endif %}

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="/css/style.css">
  
  <!-- Favicon -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased">

  <!-- ============================================
       HEADER / NAVIGATION
       ============================================ -->
  <header>
    <nav class="container">
      <div class="nav">
        <!-- Logo -->
        <a href="/" class="logo">
          <span class="logo-brand">adam</span>
          <span class="text-xs font-mono tracking-[3px] text-zinc-500">dev</span>
        </a>

        <!-- Navigation Links -->
        <ul id="nav-links" class="nav-links">
          <li><a href="/#about">About</a></li>
          <li><a href="/#projects">Projects</a></li>
          <li><a href="/#products">Products</a></li>
          <li><a href="/blog/" {% if page.url contains '/blog/' %}class="active"{% endif %}>Blog</a></li>
          <li><a href="/#contact">Contact</a></li>
        </ul>

        <!-- Actions -->
        <div class="nav-actions">
          <a href="/#projects" 
             class="btn btn-primary text-sm px-6 py-2.5 hidden md:inline-flex">
            View Work
          </a>
          
          <!-- Mobile Menu Button -->
          <button id="mobile-menu-btn" 
                  class="mobile-menu-btn md:hidden"
                  aria-label="Toggle navigation">
            <span class="text-2xl">☰</span>
          </button>
        </div>
      </div>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <!-- ============================================
       FOOTER
       ============================================ -->
  <footer>
    <div class="container">
      <div class="footer-content">
        <div class="text-sm text-zinc-500">
          © {{ site.time | date: '%Y' }} Adam. Crafted with precision and a touch of dark magic.
        </div>
        
        <div class="footer-links text-sm">
          <a href="/#about">About</a>
          <a href="/#projects">Projects</a>
          <a href="/#products">Products</a>
          <a href="https://github.com/slashadams" target="_blank">GitHub</a>
          <a href="/blog/">Blog</a>
          <a href="/#contact">Contact</a>
        </div>
      </div>
    </div>
  </footer>

  <!-- Custom JavaScript -->
  <script src="/js/script.js" defer></script>
</body>
</html>
